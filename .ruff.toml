# .ruff.toml - Ruff configuration for Magalu AI Suite
# Tailored to allow existing legacy style patterns while maintaining security and core code quality checks.

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

# Same as Black.
line-length = 120

[lint]
# Select core rules (E: pycodestyle errors, F: Pyflakes, W: pycodestyle warnings)
select = ["E", "F", "W"]

# Ignore rules that are widely present in the existing codebase to avoid massive intrusive refactoring
ignore = [
    "E701",  # Multiple statements on one line
    "E722",  # Do not use bare except
    "E402",  # Module level import not at top of file
    "F841",  # Local variable assigned but never used
    "F401",  # Unused import
    "E501",  # Line too long
    "W291",  # Trailing whitespace
    "W293",  # Blank line contains whitespace
    "F821",  # Undefined name (legacy scripts)
    "E741"   # Ambiguous variable name ('l')
]


